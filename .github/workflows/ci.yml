name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aws,test]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Forbid internal imports of nexus-backend
        run: |
          set -e
          if grep -RIn --include='*.py' -E '^\s*(from|import)\s+src(\.|\s)' src tests; then
            echo "::error::Library must not import from 'src.*' (nexus-backend internal layout)."
            exit 1
          fi
          if grep -RIn --include='*.py' -E 'nexus[_-]backend' src; then
            echo "::error::Library must not reference nexus-backend."
            exit 1
          fi

      - name: Run tests
        run: pytest --cov=nexus_ai_engine --cov-report=term-missing

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 7
