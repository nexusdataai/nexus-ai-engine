name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: Doc front-matter lint
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Lint doc front-matter
        run: python scripts/lint_doc_frontmatter.py

  quality:
    name: Quality gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: docs-gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aws,test,server,harness]"

      - name: Guardrail (forbidden imports)
        # Scoped to contracts for alpha CI; full-package guardrail runs via `make guardrail`.
        run: make guardrail
        continue-on-error: true

      - name: Ruff lint (contracts)
        run: make lint-ci

      - name: Mypy
        run: make typecheck
        continue-on-error: true  # tighten to false once phase 3 lands

      - name: Unit + contract tests
        run: |
          pytest tests/unit tests/contracts -q

      - name: Coverage (integration + contract + property + e2e + journeys)
        env:
          COV_FAIL: '60'
        run: |
          pytest tests/integration tests/contract tests/property tests/e2e tests/journeys \
            --cov=nexus_ai_engine --cov-branch \
            --cov-report=term-missing --cov-report=html --cov-report=xml \
            --cov-fail-under=${COV_FAIL}

      - name: Build distribution
        run: make build

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Upload build artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  bdd-and-endurance:
    name: BDD + endurance smoke
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aws,test,server,harness]"

      - name: BDD
        run: make test-bdd

      - name: Endurance smoke
        run: make test-endurance

      - name: Upload BDD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: reports/bdd.html
          retention-days: 14

  endurance-full:
    name: Endurance (heavy) — nightly / manual only
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aws,test,server,harness]"

      - name: Run full endurance suite
        run: make test-endurance-full
