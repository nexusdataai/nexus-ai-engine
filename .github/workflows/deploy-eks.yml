name: Deploy reference server to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, stage, prod]
      cluster_name:
        description: 'EKS cluster name override (leave empty for environment default)'
        required: false
        type: string
      image_tag:
        description: "Image tag to deploy (defaults to the commit SHA; use 'latest' to redeploy)"
        required: false
        type: string

env:
  AWS_REGION: 'us-east-1'
  IMAGE_NAME: 'nexus-ai-engine'

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    environment: eks-${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="$(git rev-parse --short HEAD)"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        run: |
          CLUSTER="${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME || 'nexus-dev' }}"
          aws eks update-kubeconfig --name "${CLUSTER}" --region ${{ env.AWS_REGION }}
          echo "CLUSTER=${CLUSTER}" >> "$GITHUB_ENV"

      - name: Apply manifests
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          NAMESPACE: nexus-ai-engine-${{ inputs.environment }}
        run: |
          cd deploy/k8s
          # Patch image reference + namespace at apply time so committed YAML stays generic
          sed -i "s#REPLACE_WITH_ECR_REGISTRY#${REGISTRY}#g" kustomization.yaml deployment.yaml
          sed -i "s/nexus-ai-engine-dev/${NAMESPACE}/g" namespace.yaml serviceaccount.yaml configmap.yaml deployment.yaml service.yaml hpa.yaml networkpolicy.yaml kustomization.yaml
          kubectl apply -k .
          kubectl -n "${NAMESPACE}" set image deploy/nexus-ai-engine server="${REGISTRY}/nexus-ai-engine:${IMAGE_TAG}"
          kubectl -n "${NAMESPACE}" rollout status deploy/nexus-ai-engine --timeout=180s

      - name: Smoke test /health
        env:
          NAMESPACE: nexus-ai-engine-${{ inputs.environment }}
        run: |
          kubectl -n "${NAMESPACE}" port-forward svc/nexus-ai-engine 18000:8000 &
          PF_PID=$!
          sleep 4
          set +e
          curl -fsS http://localhost:18000/health
          STATUS=$?
          kill $PF_PID 2>/dev/null || true
          exit $STATUS

      - name: Deployment summary
        if: always()
        env:
          NAMESPACE: nexus-ai-engine-${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          echo "## nexus-ai-engine EKS Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${CLUSTER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${NAMESPACE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${IMAGE_NAME}:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pod status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl -n "${NAMESPACE}" get pods -l app.kubernetes.io/name=nexus-ai-engine >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
