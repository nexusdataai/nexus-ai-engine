AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Nexus AI Engine storage — DynamoDB (journeys, executions, prompts) and S3
  (journey logs, reports) per docs/spec/050-data-model-and-storage.md.

Parameters:
  Environment:
    Type: String
    Description: Environment suffix (dev, staging, prod)
    AllowedPattern: "^[a-z0-9-]+$"
  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  PITREnabled: !Equals [!Ref EnablePointInTimeRecovery, "true"]

Resources:
  JourneysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ai-engine-journeys-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PITREnabled, true, false]
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: entity_type
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: entity_type
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: nexus:component
          Value: ai-engine
        - Key: nexus:environment
          Value: !Ref Environment

  ExecutionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ai-engine-executions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PITREnabled, true, false]
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: journey_id
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: journey_id
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: nexus:component
          Value: ai-engine
        - Key: nexus:environment
          Value: !Ref Environment

  PromptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ai-engine-prompts-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PITREnabled, true, false]
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: nexus:component
          Value: ai-engine
        - Key: nexus:environment
          Value: !Ref Environment

  JourneyLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-engine-journey-logs-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: nexus:component
          Value: ai-engine
        - Key: nexus:environment
          Value: !Ref Environment

  JourneyReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-engine-journey-reports-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: nexus:component
          Value: ai-engine
        - Key: nexus:environment
          Value: !Ref Environment

Outputs:
  JourneysTableName:
    Value: !Ref JourneysTable
  ExecutionsTableName:
    Value: !Ref ExecutionsTable
  PromptsTableName:
    Value: !Ref PromptsTable
  JourneyLogsBucketName:
    Value: !Ref JourneyLogsBucket
  JourneyReportsBucketName:
    Value: !Ref JourneyReportsBucket
