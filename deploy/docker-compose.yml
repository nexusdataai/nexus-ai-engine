services:
  nexus-ai-engine:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nexus-ai-engine:local
    container_name: nexus-ai-engine
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      AWS_REGION: us-east-1
      MAX_CONCURRENT_JOBS: "10"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
