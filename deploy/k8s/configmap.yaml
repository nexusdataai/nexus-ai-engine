apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-ai-engine-config
  namespace: ai-engine
  labels:
    app.kubernetes.io/name: nexus-ai-engine
data:
  # Non-secret EngineConfig inputs. Secrets (API keys, role ARN overrides,
  # etc.) belong in a separate Secret and should be referenced via
  # `envFrom.secretRef` in the Deployment.
  #
  # ${ENV} placeholder is sed-substituted at apply time by deploy-and-test.sh.
  AWS_REGION: "${REGION}"
  ENVIRONMENT: "${ENV}"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  MAX_CONCURRENT_JOBS: "10"

  # Resource names follow the convention: ai-engine-journeys-${ENV}-*
  # The library distinguishes journeys/jobs/live-logs/reports/prompts by
  # PK prefix within the same DynamoDB table.
  DYNAMODB_TRANSFORMATION_TABLE: "ai-engine-journeys-${ENV}"
  DYNAMODB_PROMPTS_TABLE: "ai-engine-journeys-${ENV}"
  S3_JOURNEY_LOGS_BUCKET: "ai-engine-journeys-logs-${ENV}"
  S3_JOURNEY_REPORTS_BUCKET: "ai-engine-journeys-reports-${ENV}"
