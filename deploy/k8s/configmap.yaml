apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-ai-engine-config
  namespace: nexus-ai-engine-dev
  labels:
    app.kubernetes.io/name: nexus-ai-engine
data:
  # Non-secret EngineConfig inputs. Secrets (role ARN overrides, API keys for
  # LLM providers, etc.) must come from a separate Kubernetes Secret and be
  # referenced via `envFrom.secretRef` in the Deployment.
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  MAX_CONCURRENT_JOBS: "10"
  # Placeholders — fill per environment before enabling the corresponding
  # phase's routes.
  DYNAMODB_TRANSFORMATION_TABLE: ""
  DYNAMODB_PROMPTS_TABLE: ""
  S3_JOURNEY_LOGS_BUCKET: ""
  S3_JOURNEY_REPORTS_BUCKET: ""
