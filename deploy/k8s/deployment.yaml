apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ai-engine
  namespace: nexus-ai-engine-dev
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-ai-engine
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: nexus-ai-engine
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexus-ai-engine
      containers:
        - name: server
          # Replace registry with the ECR registry URI (reusing nexus-backend's
          # AWS account). The deploy-eks workflow substitutes a git-SHA tag.
          image: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexus-ai-engine-config
            # Uncomment once a Secret named nexus-ai-engine-secrets exists:
            # - secretRef:
            #     name: nexus-ai-engine-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
