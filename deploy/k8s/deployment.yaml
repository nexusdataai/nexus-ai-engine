apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ai-engine
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-ai-engine
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: ai-engine-role-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine-api:latest
          imagePullPolicy: IfNotPresent
          command: ["nexus-ai-engine"]
          args: ["serve", "--http", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexus-ai-engine-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
