apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-engine

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - hpa.yaml
  - worker-hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: nexus-ai-engine
  app.kubernetes.io/part-of: nexus

images:
  - name: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine
    newTag: latest
