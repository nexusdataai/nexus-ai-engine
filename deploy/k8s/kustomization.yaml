apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-engine-dev

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - ui-deployment.yaml
  - service.yaml
  - ui-service.yaml

commonLabels:
  app.kubernetes.io/part-of: nexus

images:
  - name: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine-api
    newTag: latest
  - name: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine-ui
    newTag: latest
