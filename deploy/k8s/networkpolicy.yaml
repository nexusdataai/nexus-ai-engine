# Deny-all ingress by default, then explicitly allow from ingress controllers
# and from pods in the same namespace. Adjust `podSelector`/namespace labels
# per cluster convention before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-ai-engine
  namespace: nexus-ai-engine-dev
  labels:
    app.kubernetes.io/name: nexus-ai-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-ai-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: nexus
      ports:
        - protocol: TCP
          port: 8000
