# Deny-all ingress by default; allow from ingress controllers (kube-system)
# and from pods in the same namespace. Adjust namespace selectors to match
# your cluster's ingress controller convention before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-ai-engine
  namespace: ai-engine
  labels:
    app.kubernetes.io/name: nexus-ai-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-ai-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: nexus
      ports:
        - protocol: TCP
          port: 8000
