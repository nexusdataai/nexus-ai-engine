apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-engine-role-sa
  namespace: ai-engine
  labels:
    app.kubernetes.io/name: nexus-ai-engine
  annotations:
    # IRSA — patched at apply time by deploy/deploy-and-test.sh with the
    # actual role ARN from the admin script. The role itself
    # (`ai-engine-role`) is created once per cluster by an admin via
    # deploy/admin/setup-admin-role.sh.
    eks.amazonaws.com/role-arn: "REPLACE_WITH_IAM_ROLE_ARN"
