apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-ai-engine
  namespace: nexus-ai-engine-dev
  labels:
    app.kubernetes.io/name: nexus-ai-engine
  annotations:
    # Replace with the IAM role ARN that the pod should assume via IRSA.
    # Reuse the nexus-backend pod's role if DynamoDB/S3 permissions overlap,
    # or create a role with identical trust policy + narrowed permissions.
    # Leave the placeholder until the deploy-eks workflow patches it.
    eks.amazonaws.com/role-arn: "REPLACE_WITH_IAM_ROLE_ARN"
