apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ai-engine-ui
  labels:
    app: nexus-ai-engine-ui
    app.kubernetes.io/name: nexus-ai-engine-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ai-engine-ui
  template:
    metadata:
      labels:
        app: nexus-ai-engine-ui
        app.kubernetes.io/name: nexus-ai-engine-ui
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ui
          image: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
