apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ai-engine-worker
  namespace: ai-engine
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-ai-engine
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-ai-engine
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ai-engine-role-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: REPLACE_WITH_ECR_REGISTRY/nexus-ai-engine:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "nexus_ai_engine.workers.temporal.worker_main"]
          envFrom:
            - configMapRef:
                name: nexus-ai-engine-config
          env:
            - name: TEMPORAL_TARGET
              value: "temporal-frontend.temporal:7233"
            - name: TEMPORAL_TASK_QUEUE
              value: "nexus-ai-execution"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
