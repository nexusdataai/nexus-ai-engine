<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Test Reports Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            color: #1e293b; min-height: 100vh;
        }
        /* Hidden until the recursion guard in the script decides whether we are
           the top-level portal (show full UI) or a recursively-embedded copy
           (replace body with a placeholder). Prevents the flash of nested
           portals seen when CloudFront's SPA-style 404 fallback returns the
           root index.html for a missing per-component dashboard. */
        body { visibility: hidden; }
        body.ready { visibility: visible; }
        .embedded-placeholder {
            padding: 80px 32px; text-align: center; color: #9ca3af;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: white;
        }
        .embedded-placeholder .big-icon { font-size: 56px; margin-bottom: 16px; }
        .embedded-placeholder h3 { font-size: 20px; color: #6b7280; margin-bottom: 8px; }
        .embedded-placeholder p { font-size: 14px; max-width: 480px; margin: 0 auto; line-height: 1.6; }
        .embedded-placeholder code {
            background: #f3f4f6; color: #374151; padding: 2px 8px;
            border-radius: 4px; font-size: 13px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 32px 24px 80px; text-align: center;
            position: relative; overflow: hidden;
        }
        .header h1 { font-size: 32px; margin-bottom: 6px; font-weight: 700; }
        .header p { font-size: 14px; opacity: 0.9; }
        .main-container {
            max-width: 1200px; margin: -56px auto 0;
            padding: 0 24px 40px; position: relative; z-index: 10;
        }
        .tabs-box {
            background: white; border-radius: 20px;
            box-shadow: 0 10px 60px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .tab-strip {
            display: flex; gap: 0;
            border-bottom: 1px solid #e5e7eb;
            background: #fafbfc;
            overflow-x: auto;
        }
        .tab {
            flex: 1; min-width: 160px;
            padding: 18px 20px; cursor: pointer;
            font-size: 14px; font-weight: 600; color: #6b7280;
            background: transparent; border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            white-space: nowrap;
        }
        .tab:hover { color: #374151; background: #f3f4f6; }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }
        .tab-icon { font-size: 18px; }
        .tab-content {
            position: relative;
            min-height: 720px;
            background: white;
        }
        .frame-wrap { display: none; }
        .frame-wrap.active { display: block; }
        iframe.tab-frame {
            width: 100%;
            height: 1100px;
            border: none;
            display: block;
        }
        /* Back-to-dashboard bar shown above the iframe when the user has
           drilled into a per-tier report. Hidden when the iframe is on the
           per-component dashboard root. */
        .back-bar {
            display: none;
            background: #f9fafb;
            padding: 10px 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        .back-bar.visible { display: block; }
        .back-btn {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .back-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .placeholder {
            padding: 80px 32px; text-align: center; color: #9ca3af;
        }
        .placeholder .big-icon { font-size: 56px; margin-bottom: 16px; }
        .placeholder h3 { font-size: 20px; color: #6b7280; margin-bottom: 8px; }
        .placeholder p { font-size: 14px; max-width: 480px; margin: 0 auto; line-height: 1.6; }
        .placeholder code {
            background: #f3f4f6; color: #374151; padding: 2px 8px;
            border-radius: 4px; font-size: 13px;
        }
        .footer {
            text-align: center; padding: 18px 16px 8px;
            color: #9ca3af; font-size: 12px;
        }
        @media (max-width: 768px) {
            .main-container { margin-top: -32px; }
            .header { padding: 28px 24px 64px; }
            .header h1 { font-size: 24px; }
            .tab { min-width: 120px; padding: 14px 12px; font-size: 12px; }
            iframe.tab-frame { height: 900px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nexus Test Reports Portal</h1>
        <p>Component test results across the Nexus platform</p>
    </div>
    <div class="main-container">
        <div class="tabs-box">
            <div class="tab-strip" id="tabStrip">
                <button class="tab" data-component="ai-engine"><span class="tab-icon">⚙️</span>AI Engine</button>
                <button class="tab" data-component="backend"><span class="tab-icon">🧩</span>Backend</button>
                <button class="tab" data-component="deployer"><span class="tab-icon">🚀</span>Deployer</button>
                <button class="tab" data-component="simulator"><span class="tab-icon">🛰️</span>Simulator</button>
            </div>
            <div class="tab-content" id="tabContent">
                <div class="frame-wrap" data-component="ai-engine"></div>
                <div class="frame-wrap" data-component="backend"></div>
                <div class="frame-wrap" data-component="deployer"></div>
                <div class="frame-wrap" data-component="simulator"></div>
            </div>
        </div>
        <div class="footer">Click a tab to load its dashboard. Each component publishes independently from its own deploy/test.sh.</div>
    </div>

    <script>
        (function () {
            // Recursion guard: this distribution serves the root index.html
            // for any 404 (CloudFront custom-error / SPA fallback). When the
            // portal's iframe asks for /<component>/index.html and that key
            // does not exist in S3, CloudFront returns the portal HTML with
            // 200, which loads recursively forever. If we detect we are
            // running inside an iframe, replace the body with a placeholder
            // and stop — that breaks the recursion at depth 1.
            if (window.top !== window.self) {
                var slug = '';
                try {
                    var refUrl = new URL(document.referrer || '', location.href);
                    var match = (location.pathname || '').match(/\/([^\/]+)\/index\.html$/);
                    if (match) slug = match[1];
                } catch (_) { /* noop */ }
                var label = slug ? slug : 'this component';
                document.body.innerHTML =
                    '<div class="embedded-placeholder">' +
                    '<div class="big-icon">📭</div>' +
                    '<h3>No reports yet for ' + label + '</h3>' +
                    '<p>Run <code>UPLOAD_TO_S3=true ./deploy/test.sh</code> in the ' +
                    label + ' repo to publish the first dashboard here.</p>' +
                    '</div>';
                document.body.classList.add('ready');
                return;
            }

            var tabs = document.querySelectorAll('.tab');
            var wraps = document.querySelectorAll('.frame-wrap');
            var loaded = {};

            function ensureLoaded(component) {
                if (loaded[component]) return;
                loaded[component] = true;
                var wrap = document.querySelector('.frame-wrap[data-component="' + component + '"]');
                if (!wrap) return;
                var url = './' + component + '/index.html';
                fetch(url, { method: 'HEAD' })
                    .then(function (resp) {
                        if (resp.ok) {
                            var iframe = document.createElement('iframe');
                            iframe.className = 'tab-frame';
                            iframe.src = url;
                            iframe.title = component + ' test reports';
                            wrap.appendChild(iframe);
                            attachBackBar(wrap, component, iframe);
                        } else {
                            renderPlaceholder(wrap, component);
                        }
                    })
                    .catch(function () { renderPlaceholder(wrap, component); });
            }

            function attachBackBar(wrap, component, iframe) {
                var bar = document.createElement('div');
                bar.className = 'back-bar';
                var btn = document.createElement('button');
                btn.className = 'back-btn';
                btn.type = 'button';
                btn.innerHTML = '\u2190 Back to ' + component + ' dashboard';
                btn.addEventListener('click', function () {
                    iframe.src = './' + component + '/index.html';
                });
                bar.appendChild(btn);
                wrap.insertBefore(bar, iframe);

                // Toggle the bar based on what the iframe is currently showing.
                // Same-origin (CloudFront-fronted), so reading contentWindow is
                // allowed. Defensive try/catch in case a future component HTML
                // ever ends up cross-origin.
                iframe.addEventListener('load', function () {
                    try {
                        var path = iframe.contentWindow.location.pathname || '';
                        var dashboard = '/' + component + '/index.html';
                        var atRoot = path === '/' + component + '/' || path === '/' + component;
                        var atDashboard = path.endsWith(dashboard) || atRoot;
                        bar.classList.toggle('visible', !atDashboard);
                    } catch (e) {
                        bar.classList.add('visible');
                    }
                });
            }

            function renderPlaceholder(wrap, component) {
                wrap.innerHTML =
                    '<div class="placeholder">' +
                    '<div class="big-icon">📭</div>' +
                    '<h3>No reports yet for ' + component + '</h3>' +
                    '<p>Run <code>UPLOAD_TO_S3=true ./deploy/test.sh</code> in the ' +
                    component + ' repo to publish the first dashboard here.</p>' +
                    '</div>';
            }

            function activate(component) {
                tabs.forEach(function (t) {
                    t.classList.toggle('active', t.dataset.component === component);
                });
                wraps.forEach(function (w) {
                    w.classList.toggle('active', w.dataset.component === component);
                });
                ensureLoaded(component);
                if (history.replaceState) {
                    history.replaceState(null, '', '#' + component);
                }
            }

            tabs.forEach(function (t) {
                t.addEventListener('click', function () { activate(t.dataset.component); });
            });

            var initial = (location.hash || '').replace('#', '');
            var valid = ['ai-engine', 'backend', 'deployer', 'simulator'];
            if (valid.indexOf(initial) === -1) initial = 'ai-engine';
            activate(initial);
            document.body.classList.add('ready');
        })();
    </script>
</body>
</html>
