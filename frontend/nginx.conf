worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript application/wasm image/svg+xml;

    map $http_x_forwarded_proto $forwarded_proto_from_client {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_cf_connecting_ip $proxy_forwarded_proto {
        ""      $forwarded_proto_from_client;
        default https;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            try_files $uri =404;
        }

        location = /VERSION {
            alias /VERSION;
            default_type text/plain;
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /health {
            proxy_pass http://nexus-ai-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /readiness {
            proxy_pass http://nexus-ai-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /version {
            proxy_pass http://nexus-ai-engine:8000/version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /ui {
            return 302 /journeys;
        }

        location ^~ /ui/ {
            return 302 /journeys;
        }

        location /api/ {
            proxy_pass http://nexus-ai-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_redirect http:// https://;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 180s;
        }
    }
}
