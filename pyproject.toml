[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai-engine"
version = "0.1.0a1"
description = "Journey/stage/job AI orchestration engine extracted from nexus-backend. Port-based core with DynamoDB/S3 default adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nexus AI Engine Team" },
]
keywords = ["ai", "orchestration", "journey", "pipeline", "mcp", "nexus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.10",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.38",
    "botocore>=1.38",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/nexusdataai/nexus-ai-engine"
Repository = "https://github.com/nexusdataai/nexus-ai-engine"
Issues = "https://github.com/nexusdataai/nexus-ai-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ai_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nexus_ai_engine",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/nexus_ai_engine"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
