[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai-engine"
version = "0.1.0a2"
description = "Journey/stage/job AI orchestration engine extracted from nexus-backend. Port-based core with DynamoDB/S3 default adapters, a reference FastAPI/MCP server, and an importable testing harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nexus AI Engine Team" },
]
keywords = ["ai", "orchestration", "journey", "pipeline", "mcp", "nexus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.10",
    "loguru>=0.7",
    "pyyaml>=6.0",
    # boto3/botocore are required: the DynamoDB-backed services
    # (JourneyService, PromptsService, SchedulerService,
    # LogsAndReportsService) and the AWSClientManager + LocalStack
    # adapters all import boto3 unconditionally.
    "boto3>=1.38",
    "botocore>=1.38",
]

[project.optional-dependencies]
aws = [
    # Kept for backwards compatibility with consumers pinning the
    # ``[aws]`` extra; boto3/botocore are now in the base install.
    "boto3>=1.38",
    "botocore>=1.38",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "fastmcp>=2.12",
]
harness = [
    "nexus-ai-engine[server]",
    "behave>=1.3",
    "behave-html-formatter>=0.9",
    "pytest-benchmark>=4.0",
    "pytest-json-report>=1.5",
    "pytest-html>=4.1",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-mock>=3.14",
    "pytest-json-report>=1.5",
    "pytest-html>=4.1",
    "moto>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-mock>=3.14",
    "moto>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "pytest-watch>=4.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
nexus-ai-engine = "nexus_ai_engine.server.cli:main"

[project.entry-points.pytest11]
nexus_ai_engine = "nexus_ai_engine.testing.fixtures"

[project.urls]
Homepage = "https://github.com/nexusdataai/nexus-ai-engine"
Repository = "https://github.com/nexusdataai/nexus-ai-engine"
Issues = "https://github.com/nexusdataai/nexus-ai-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ai_engine"]
# Ensure the embedded UI assets (HTML/JS/CSS/SVG) ship in the wheel alongside
# the Python package. Hatchling includes .py by default; everything else
# needs to be listed explicitly.
include = [
    "src/nexus_ai_engine/**/*.py",
    "src/nexus_ai_engine/server/static/**/*",
    "src/nexus_ai_engine/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/nexus_ai_engine",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "heavy: long-running endurance scenarios skipped by default",
    "integration: requires moto-backed AWS mocks",
    "e2e: runs against in-process FastAPI harness",
    "bdd: behave-driven scenarios",
]

[tool.coverage.run]
source = ["src/nexus_ai_engine"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
exclude = ["tests/", "build/", "dist/"]
