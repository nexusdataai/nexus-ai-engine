[tox]
envlist = py310, py311, py312, lint, typecheck
isolated_build = true

[testenv]
extras =
    dev
    aws
    test
    server
    harness
commands =
    pytest --cov=nexus_ai_engine --cov-branch --cov-report=term-missing \
           tests/unit tests/integration tests/contract tests/property tests/e2e tests/journeys

[testenv:lint]
skip_install = true
deps = ruff>=0.6
commands = ruff check backend/src tests

[testenv:typecheck]
extras =
    dev
    server
    harness
commands = mypy backend/src/nexus_ai_engine
